<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b5394">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Produção">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<title>Produção — Leitura</title>
<style>
  :root { --azul: #0b5394; --azul2: #1c7ed6; --verde: #2b8a3e; --vermelho: #c92a2a; --amarelo: #f59f00; --laranja: #e8590c; --cinza: #f1f3f5; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; color: #212529; }
  body { min-height: 100vh; background: #0b5394; overflow-x: hidden; }
  /* fundo de água com bolhas (imagem do plano de fases) */
  .fundo { position: fixed; inset: 0; z-index: -1; background: #1c7ed6 url('fundo.jpg') center / cover no-repeat; }
  .fundo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,83,148,.55) 0%, rgba(11,83,148,.25) 60%, rgba(11,83,148,.45) 100%); }

  .faixa-teste { background: var(--vermelho); color: #fff; text-align: center; font-weight: bold; padding: 6px; letter-spacing: 1px; }
  .marca { text-align: center; padding: 18px 10px 4px; }
  .marca .logo { display: inline-block; background: #fff; border-radius: 16px; padding: 10px 18px; box-shadow: 0 4px 18px rgba(0,0,0,.25); }
  .marca .logo img { display: block; height: 110px; width: auto; }
  .topo { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; background: rgba(0,0,0,.35); color: #fff; }
  .topo .quem { font-size: 15px; line-height: 1.25; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .topo .quem img { height: 46px; background: #fff; border-radius: 8px; padding: 3px; flex-shrink: 0; }
  .topo .quem b { font-size: 18px; }
  .topo .acoes { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .chip { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 13px; font-weight: bold; background: rgba(255,255,255,.2); margin-top: 3px; }
  .chip.off { background: var(--amarelo); color: #000; }
  .cartao { background: #fff; border-radius: 12px; padding: 18px; margin: 14px auto; max-width: 620px; box-shadow: 0 4px 18px rgba(0,0,0,.2); }
  h2, h3 { margin: 0 0 12px 0; color: var(--azul); }
  label { display: block; font-weight: bold; margin: 10px 0 4px; }
  input, textarea { width: 100%; font-size: 20px; padding: 12px; border: 2px solid #ced4da; border-radius: 8px; font-family: inherit; }
  button { display: inline-block; font-size: 18px; font-weight: bold; padding: 14px 18px; border: 0; border-radius: 10px; background: var(--azul); color: #fff; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.sec { background: #495057; } button.claro { background: #e7f5ff; color: var(--azul); }
  button.perigo { background: var(--vermelho); } button.ok { background: var(--verde); } button.lar { background: var(--laranja); }
  button.peq { font-size: 14px; padding: 8px 12px; }
  .bloco { width: 100%; margin-top: 10px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .grade button { min-height: 72px; }
  .msg { padding: 10px 12px; border-radius: 8px; margin: 10px 0; font-weight: bold; }
  .msg.erro { background: #ffe3e3; color: var(--vermelho); } .msg.ok { background: #d3f9d8; color: var(--verde); }
  .msg.info { background: #e7f5ff; color: var(--azul); } .msg.alerta { background: #fff3bf; color: #7a4f00; }
  .oculto { display: none !important; }
  .linha { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .linha > * { flex: 1; }
  .rodape { text-align: center; color: #fff; font-size: 12px; padding: 6px 12px; margin: 10px auto; width: fit-content; border-radius: 10px; background: rgba(11,83,148,.75); }
  .espera { position: fixed; inset: 0; background: rgba(255,255,255,.55); display: flex; align-items: center; justify-content: center; z-index: 90; font-size: 24px; font-weight: bold; color: var(--azul); }

  /* tela de leitura */
  .leitura { max-width: 900px; margin: 0 auto; padding: 10px; }
  .pedido { background: #fff; border-radius: 12px; padding: 14px; text-align: center; font-size: 26px; font-weight: bold; color: var(--azul); }
  .pedido small { display: block; font-size: 16px; color: #495057; font-weight: normal; margin-top: 4px; }
  .pedido.ean { background: #fff3bf; color: #7a4f00; }
  .pedido.nc { background: var(--laranja); color: #fff; }
  .pedido.nc small { color: #fff; }
  .camera { position: relative; margin-top: 10px; background: #000; border-radius: 12px; overflow: hidden; min-height: 120px; }
  .camera video { width: 100%; max-height: 46vh; display: block; object-fit: cover; }
  .camera .mira { position: absolute; left: 10%; right: 10%; top: 50%; height: 0; border-top: 3px solid rgba(255,80,80,.85); }
  .camera .camMsg { color: #fff; padding: 18px; text-align: center; }
  .dica { min-height: 22px; text-align: center; color: #fff; font-weight: bold; margin-top: 6px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .manual { background: #fff; border-radius: 12px; padding: 10px; margin-top: 10px; }
  .manual .linha > input { flex: 3; } .manual .linha > button { flex: 1; }

  /* resultado */
  .res { border-radius: 12px; padding: 16px; margin-top: 10px; color: #fff; text-align: center; }
  .res.verde { background: var(--verde); }
  .res .grande { font-size: 40px; font-weight: bold; }
  .res .det { font-size: 20px; margin-top: 6px; }
  .res .pend { display: inline-block; margin-top: 8px; background: var(--amarelo); color: #000; padding: 4px 10px; border-radius: 10px; font-size: 15px; font-weight: bold; }
  .res .nc { margin-top: 12px; background: var(--laranja); color: #fff; font-size: 22px; padding: 16px 30px; border: 3px solid #fff; }
  .sobre { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; color: #fff; }
  .sobre.vermelha { background: var(--vermelho); z-index: 75; }
  .sobre.travada { background: #343a40; }
  .sobre.laranja { background: var(--laranja); justify-content: flex-start; overflow: auto; z-index: 62; }
  .sobre .grande { font-size: 44px; font-weight: bold; }
  .sobre .motivo { font-size: 26px; margin: 16px 0; max-width: 800px; }
  .sobre .lista { background: rgba(0,0,0,.2); border-radius: 10px; padding: 10px 14px; max-height: 45vh; overflow: auto; text-align: left; font-size: 18px; width: 100%; max-width: 760px; }
  .sobre button.ciente { font-size: 28px; padding: 20px 50px; background: #fff; color: var(--vermelho); margin-top: 16px; }
  .sobre.travada button { margin: 6px; }
  /* tela laranja da NC */
  .ncform { width: 100%; max-width: 760px; text-align: left; }
  .ncform h1 { text-align: center; font-size: 34px; margin: 6px 0 10px; }
  .ncform .serial { background: rgba(0,0,0,.18); border-radius: 10px; padding: 10px 14px; font-size: 24px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .ncform label { color: #fff; font-size: 18px; }
  .ncform .tipos { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .ncform .tipos button { background: #fff; color: var(--laranja); min-height: 60px; font-size: 17px; }
  .ncform .tipos button.sel { background: #7a2e00; color: #fff; outline: 4px solid #fff; }
  .ncform textarea { min-height: 80px; font-size: 18px; }
  .ncform .foto { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .ncform .foto img { max-height: 140px; border-radius: 8px; border: 3px solid #fff; }
  .ncform .acoes { display: flex; gap: 10px; margin-top: 16px; }
  .ncform .acoes button { flex: 1; font-size: 22px; padding: 18px; }
  .ncform .registrar { background: #fff; color: var(--laranja); }
  .ncform .msg { color: #7a2e00; background: #fff3bf; }
  .sobre.laranja .grande { margin-top: 10vh; }
  .sobre.laranja button.ciente { color: var(--laranja); }
  /* sino e painel de NCs */
  .sino { position: relative; background: #fff; color: var(--azul); }
  .sino .num { display: inline-block; min-width: 24px; padding: 1px 6px; border-radius: 12px; background: #868e96; color: #fff; margin-left: 4px; }
  .sino.tem .num { background: var(--laranja); }
  .sino.alerta { animation: pisca 1s ease-in-out infinite; }
  .sino.alerta .num { background: var(--vermelho); }
  @keyframes pisca { 50% { background: #ffd8a8; } }
  .ncpainel { position: fixed; inset: 0; z-index: 64; background: rgba(11,83,148,.96); overflow: auto; padding: 12px; color: #212529; }
  .ncpainel .barra { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: #fff; max-width: 900px; margin: 0 auto 10px; }
  .ncpainel .barra h2 { color: #fff; margin: 0; }
  .ncpainel .corpo { max-width: 900px; margin: 0 auto; }
  .cnc { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; border-left: 10px solid var(--laranja); }
  .cnc.venc { border-left-color: var(--vermelho); }
  .cnc .t { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 20px; font-weight: bold; }
  .cnc .d { margin: 6px 0; font-size: 16px; }
  .cnc .hist { font-size: 14px; color: #495057; }
  .cnc .bts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .cnc .bts button { flex: 1; min-width: 120px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 13px; font-weight: bold; background: #e9ecef; }
  .tag.verm { background: #ffe3e3; color: var(--vermelho); } .tag.lar { background: #ffe8cc; color: #a33b00; }
  .alertas { background: #fff3bf; border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; color: #7a4f00; font-weight: bold; }
  .alertas div { margin: 4px 0; }
  .modal-fundo { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-start; justify-content: center; z-index: 70; overflow: auto; padding: 20px 10px; }
  .modal { background: #fff; border-radius: 12px; padding: 18px; width: 100%; max-width: 620px; }
  .modal img.foto { width: 100%; border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 16px; }
  td { border-bottom: 1px solid #dee2e6; padding: 6px 8px; text-align: left; vertical-align: top; }
  ol.ajuda li { margin-bottom: 6px; }
  /* Fase 4 */
  .res .faixa { display: inline-block; margin-top: 8px; background: #7048e8; color: #fff; padding: 4px 12px; border-radius: 10px; font-size: 16px; font-weight: bold; letter-spacing: 1px; }
  .res.astp { background: #0c8599; }
  .res.astp .bts { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .res.astp .bts button { font-size: 22px; padding: 16px 28px; }
  .res.astp .bts .okastp { background: #fff; color: #0c8599; }
  .res.astp .bts .anular { background: #343a40; }
  .res.anulada { background: #495057; }
  select.lista { width: 100%; font-size: 17px; padding: 8px; border: 2px solid #ced4da; border-radius: 8px; }
</style>
</head>
<body>
<div class="fundo"></div>
<div id="faixaTeste" class="faixa-teste oculto">BASE DE TESTE ATIVA</div>

<!-- LOGIN -->
<div id="telaLogin">
  <div class="marca"><span class="logo"><img src="logo.png" alt="Loja do Bebedouro · Blue Eletro Refrigerados"></span></div>
  <div id="raiz"></div>
</div>

<!-- LEITURA -->
<div id="telaLeitura" class="oculto">
  <div class="topo">
    <div class="quem"><img src="logo.png" alt=""><div><b id="tNome"></b><br><span id="tEst"></span><br><span class="chip" id="tRede">online</span></div></div>
    <div class="acoes">
      <button class="sino peq oculto" id="btSino">🔔 NCs<span class="num" id="sinoNum">0</span></button>
      <button class="lar peq" id="btNovaNC">Registrar NC</button>
      <button class="claro peq oculto" id="btGestao">Gestão</button>
      <button class="claro peq" id="btConsulta">Consultar</button>
      <button class="claro peq" id="btAjuda2">Ajuda</button>
      <button class="perigo peq" id="btSair">Sair</button>
    </div>
  </div>
  <div class="leitura">
    <div class="pedido" id="pedido">Leia o SERIAL</div>
    <div id="resultado"></div>
    <div class="camera" id="camBox">
      <video id="video" playsinline muted></video>
      <div class="mira"></div>
      <div class="camMsg oculto" id="camMsg"></div>
    </div>
    <div class="dica" id="dica"></div>
    <div class="manual">
      <div class="linha">
        <input id="manual" placeholder="Digitar código (se a etiqueta não ler)" autocomplete="off" inputmode="text">
        <button id="btManual">Enviar</button>
      </div>
      <div class="linha" style="margin-top:8px">
        <button class="sec peq oculto" id="btCancelarEan">Cancelar esta peça</button>
        <button class="sec peq oculto" id="btCancelarNC">Cancelar NC</button>
        <button class="claro peq" id="btCamera">Reabrir câmera</button>
      </div>
    </div>
  </div>
</div>

<!-- TELA LARANJA (NC) -->
<div id="laranja" class="sobre laranja oculto"><div class="ncform" id="lrCorpo"></div></div>

<!-- PAINEL DE NCs (Qualidade, substituto, Encarregado) -->
<div id="ncPainel" class="ncpainel oculto">
  <div class="barra"><h2>Não conformidades</h2><div class="linha" style="flex:0 0 auto"><button class="claro peq" id="ncAtualizar">Atualizar</button><button class="peq" id="ncVoltar">Voltar à leitura</button></div></div>
  <div class="corpo"><div id="ncMsg"></div><div id="ncAlertas"></div><div id="ncLista"></div></div>
</div>

<!-- TELA VERMELHA -->
<div id="vermelha" class="sobre vermelha oculto">
  <div class="grande">✖ NÃO REGISTRADO</div>
  <div class="motivo" id="vMotivo"></div>
  <div id="vLista" class="lista oculto"></div>
  <button class="ciente" id="btCiente">CIENTE</button>
</div>

<!-- TABLET TRAVADO -->
<div id="travada" class="sobre travada oculto">
  <div class="grande">TABLET TRAVADO</div>
  <div class="motivo" id="trMotivo"></div>
  <div class="msg alerta" style="max-width:700px">A última peça NÃO foi registrada. Depois de destravar, leia de novo.</div>
  <div>
    <button id="btTentar">Tentar sincronizar</button>
    <button class="ok" id="btDestravar">Destravar (senha do supervisor)</button>
  </div>
  <div id="trMsg" style="max-width:700px"></div>
</div>

<div id="modal"></div>
<div class="rodape" id="rodape"></div>

<script>
/* ================= Configuração ================= */
var APP_VERSAO = 'F4.0';
var API_URL = window.API_URL_TESTE || 'https://script.google.com/macros/s/AKfycbxtCUkW9stMLHfC0YNUgiUlIqXwDj7EDF2pVmybjoVL_1Pf_EedSIcI6U9NPuBYUBc/exec';
var TIMEOUT_MS = 9000;          // sem resposta nesse tempo = sem rede (o reenvio usa o mesmo ID: não duplica)
var TIMEOUT_NC_MS = 30000;      // NC com foto: o servidor grava no Drive (mais lento)
var SINC_MS = 5 * 60 * 1000;    // sincroniza lista de travadas a cada 5 min
var FILA_MS = 15000;            // tenta enviar a fila a cada 15 s
var SINO_MS = 60000;            // sino de NCs a cada 1 min
var FOTO_PX = 1280, FOTO_Q = 0.7;
var RE_SERIAL = /^\d{6}[PT]\d{3}$/, RE_EAN13 = /^\d{13}$/;

/* ================= Armazenamento local ================= */
var LS = (function () { try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); return localStorage; } catch (e) { return null; } })();
function lsGet(k) { try { return LS ? LS.getItem(k) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { if (LS) LS.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { if (LS) LS.removeItem(k); } catch (e) {} }
function lsJson(k, padrao) { try { var v = JSON.parse(lsGet(k)); return v === null ? padrao : v; } catch (e) { return padrao; } }
function lsPut(k, v) { lsSet(k, JSON.stringify(v)); }

var APP = { token: null, usuario: null, sinc: null, dispositivo: lsGet('dispositivo') || ('D' + Math.random().toString(36).slice(2, 8).toUpperCase()) };
lsSet('dispositivo', APP.dispositivo);

/* ================= Servidor ================= */
function erroDe(m) {
  m = String(m || 'Erro no servidor').replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '');
  var e = new Error(m);
  if (/^SESSAO_TROCA/.test(m)) e.troca = true; else if (/^SESSAO/.test(m)) e.sessao = true;
  return e;
}
function chamarCom(ms, fn, args) {
  var ctl = window.AbortController ? new AbortController() : null;
  var tm = setTimeout(function () { if (ctl) ctl.abort(); }, ms);
  return fetch(API_URL, {
    method: 'POST', redirect: 'follow', signal: ctl ? ctl.signal : undefined,
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args })
  }).then(function (r) {
    if (!r.ok) { var e = new Error('Servidor respondeu ' + r.status); e.rede = r.status >= 500 || r.status === 429; throw e; }
    return r.json();
  }, function () { var e = new Error('Sem conexão com o servidor'); e.rede = true; throw e; })
    .then(function (d) {
      clearTimeout(tm);
      contato();
      if (!d || !d.ok) throw erroDe(d && d.erro);
      return d.r;
    }, function (e) { clearTimeout(tm); throw e; });
}
function chamar(fn) { return chamarCom(TIMEOUT_MS, fn, Array.prototype.slice.call(arguments, 1)); }

/* ================= Utilidades ================= */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function mostrar(id, sim) { $(id).classList.toggle('oculto', sim === false); }
function visivel(id) { return !$(id).classList.contains('oculto'); }
function aviso(id, texto, tipo) { var e = $(id); if (!e) return; e.innerHTML = texto ? '<div class="msg ' + (tipo || 'info') + '">' + esc(texto).replace(/\n/g, '<br>') + '</div>' : ''; }
var _esp = 0;
function espera(on) {
  _esp = Math.max(0, _esp + (on ? 1 : -1));
  var e = $('espera');
  if (!e) { e = document.createElement('div'); e.id = 'espera'; e.className = 'espera oculto'; e.textContent = 'Aguarde…'; document.body.appendChild(e); }
  e.classList.toggle('oculto', _esp === 0);
}
function uuid() { return 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
function msTxt(ms) { return ms < 1000 ? ms + ' ms' : (ms / 1000).toFixed(1).replace('.', ',') + ' s'; }
function horaTxt(t) { var d = new Date(t); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function normal(s) { return String(s || '').replace(/\s+/g, '').toUpperCase(); }

/* ---- som e vibração ---- */
var AUD = null;
function somIniciar() { try { if (!AUD) AUD = new (window.AudioContext || window.webkitAudioContext)(); if (AUD.state === 'suspended') AUD.resume(); } catch (e) {} }
function bip(freq, dur, vezes) {
  try {
    if (!AUD) return;
    for (var i = 0; i < (vezes || 1); i++) {
      var o = AUD.createOscillator(), g = AUD.createGain(), t = AUD.currentTime + i * (dur + 0.08);
      o.frequency.value = freq; o.type = 'square'; g.gain.value = 0.15;
      o.connect(g); g.connect(AUD.destination); o.start(t); o.stop(t + dur);
    }
  } catch (e) {}
}
function sinalOk() { bip(1200, 0.12, 1); if (navigator.vibrate) navigator.vibrate(80); }
function sinalErro() { bip(300, 0.35, 2); if (navigator.vibrate) navigator.vibrate([300, 120, 300]); }
document.addEventListener('click', somIniciar, { passive: true });

/* ================= Estado local: contato, sincronização, fila ================= */
function contato() { lsSet('ultimoContato', String(Date.now())); lsDel('destraveAte'); atualizarRede(); }
function ultimoContato() { return Number(lsGet('ultimoContato') || 0); }
// Fila ÚNICA do tablet (leituras e NCs): cada item leva a credencial (assinada pelo servidor) de quem fez.
// É enviada assim que a rede volta, com qualquer pessoa logada ou mesmo na tela de login.
function lerFila() { return lsJson('fila', []); }
function gravarFila(f) { lsPut('fila', f); atualizarRede(); }
/** Grava a fila conferindo se coube no aparelho (NC com foto ocupa espaço). Devolve true/false. */
function gravarFilaSeguro(f) {
  try { if (!LS) return false; LS.setItem('fila', JSON.stringify(f)); atualizarRede(); return true; } catch (e) { return false; }
}
function sincLocal() { return APP.sinc || lsJson('sinc', null); }

/** Lista de peças a fazer na estação (para conferir sem rede): {h, sku: {serial: SKU}}. */
var _lista = {};
function listaEstacao(est) {
  if (_lista[est]) return _lista[est];
  var l = lsJson('lista_' + est, null);
  if (!l) return null;

/** Entrada única de códigos (câmera ou digitado). */
function aoLer(txt, origem) {
  txt = normal(txt);
  if (!txt || LEIT.ocupado || LEIT.astp || visivel('vermelha') || visivel('travada') || visivel('laranja') || visivel('ncPainel') || $('modal').innerHTML) return;
  var agora = Date.now();
  if (origem !== 'MANUAL') {
    if (txt === LEIT.ultimo && agora - LEIT.ultimoT < 2500) return;     // mesma etiqueta parada na frente
    if (LEIT.ignorar[txt] && agora - LEIT.ignorar[txt] < (LEIT.ignorarMs[txt] || 8000)) return;  // acabou de ser registrada
  }
  LEIT.ultimo = txt; LEIT.ultimoT = agora;

  if (LEIT.modoGestao) { var fg = LEIT.modoGestao; LEIT.modoGestao = null; return fg(txt); }

    return dica(RE_EAN13.test(txt) ? 'Isso é um EAN. Leia o SERIAL da peça com problema.' : 'Código não reconhecido: ' + txt);
  }
  if (LEIT.etapa === 'serial') {
    if (RE_SERIAL.test(txt)) {
      LEIT.origem = origem;
      if (leEan()) { pedirEan(txt); bip(900, 0.06, 1); return; }
      return enviar({ serial: txt });
    }
    if (RE_EAN13.test(txt)) {
      if (ehEmbalagem()) { LEIT.origem = origem; return enviarAstp(txt); } // ASTP: só o EAN, na Embalagem
      return dica('Isso é um EAN. Leia primeiro o SERIAL.');

  if (RE_SERIAL.test(txt)) {
    if (txt !== LEIT.serial) { LEIT.origem = origem; pedirEan(txt); dica('Trocou de peça: agora vale o serial ' + txt); }

function enviarAstp(ean) {
  LEIT.ocupado = true; LEIT.enviado = ean;
  var item = { idLeitura: uuid(), serial: ean, ean: '', origem: LEIT.origem === 'MANUAL' ? 'MANUAL' : 'CAMERA', horaTablet: Date.now() };
  $('pedido').className = 'pedido'; $('pedido').innerHTML = 'Registrando ASTP ' + esc(ean) + '…'; $('resultado').innerHTML = '';
  var envio = (navigator.onLine === false) ? Promise.reject(Object.assign(new Error('offline'), { rede: true })) : chamar('registrarLeitura', APP.token, item);
  envio.then(function (r) {
    LEIT.ocupado = false;
    if (r.ok) telaAstp(ean, r.sku, r.totalDia, item.idLeitura, false);
    else telaVermelha(ean + ' — ' + r.msg);
  }).catch(function (e) {
    LEIT.ocupado = false;
    if (e.sessao) return sessaoCaiu(e);
    if (e.troca) return telaTroca(false);
    if (!e.rede) return telaVermelha(ean + ' — ' + e.message + ' Leia de novo.');
    astpSemRede(item);
  });
}
function astpSemRede(item) {
  var s = sincLocal() || {}, ean = item.serial, sku = s.astp ? s.astp[ean] : '';

  if (!sku) return verm(s.eans && s.eans[ean] ? 'Leia o número de série desta peça (este EAN é do ' + s.eans[ean] + ').' : 'EAN não cadastrado: ' + ean + '.');
  var cred = s.cred;
  if (!cred || cred.uid !== APP.usuario.id || cred.est !== APP.usuario.estacao) return verm('Este tablet ainda não sincronizou com você logado: aguarde a rede.');
  if (Number(cred.ate) < Date.now()) return verm('Autorização para guardar leituras venceu (muito tempo sem rede).');
  if (travado()) return telaTravada();
  item.offline = true; item.cred = cred; item.estacao = APP.usuario.estacao; item.estacaoNome = APP.usuario.estacaoNome; item.usuarioNome = APP.usuario.nome; item.astp = true;
  var f = lerFila(); f.push(item); gravarFila(f);

  var f = lerFila();

/** Reduz a foto no tablet (lado maior ≤ px, JPEG). */
function reduzirFoto(arq, px, q) {
  return new Promise(function (ok, falha) {
    var url = URL.createObjectURL(arq), img = new Image();
    img.onload = function () {
      var k = Math.min(1, px / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', q));
    };
    img.onerror = function () { URL.revokeObjectURL(url); falha(new Error('foto')); };
    img.src = url;
  });
}
function reduzirDataUrl(url, px, q) {
  return new Promise(function (ok) {
    var img = new Image();
    img.onload = function () {
      var k = Math.min(1, px / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', q));
    };
    img.onerror = function () { ok(''); };
    img.src = url;
  });
}

  envio.then(function (r) {

}

/** Sem rede: a NC (com foto) vai para a fila do tablet; o operador separa a peça. */
function ncSemRede(d) {
  var s = sincLocal() || {}, est = APP.usuario.estacao, cred = s.cred;
  if (s.travadas && /cancelada|reprovada/.test(s.travadas[d.serial] || '')) { mostrar('laranja', false); return telaVermelha(d.serial + ' — ' + s.travadas[d.serial] + ' (sem rede)'); }
  if (!cred || cred.uid !== APP.usuario.id || cred.est !== est || Number(cred.ate) < Date.now()) {
    return aviso('ncMsgF', 'Sem rede e este tablet ainda não tem a autorização de quem está logado. Separe a peça e registre a NC quando a rede voltar.', 'erro');
  }
  var item = { tipo: 'nc', idNC: d.idNC, serial: d.serial, tipoNC: d.tipo, descricao: d.descricao, foto: d.foto, idLeitura: d.idLeitura, horaTablet: d.horaTablet,
    cred: cred, estacao: est, estacaoNome: APP.usuario.estacaoNome, usuarioNome: APP.usuario.nome };
  var f = lerFila(); f.push(item);
  if (gravarFilaSeguro(f)) return ncRegistrada(d, true, '');
  // sem espaço no aparelho: tenta a foto menor, depois sem foto
  reduzirDataUrl(d.foto, 640, 0.5).then(function (menor) {
    item.foto = menor; f[f.length - 1] = item;
    if (menor && gravarFilaSeguro(f)) return ncRegistrada(d, true, 'Foto guardada em tamanho menor (pouco espaço no tablet).');
    item.foto = ''; f[f.length - 1] = item;
    if (gravarFilaSeguro(f)) return ncRegistrada(d, true, 'Sem espaço para a foto: NC guardada SEM foto.');
    aviso('ncMsgF', 'Sem espaço no tablet para guardar a NC. Separe a peça e registre quando a rede voltar.', 'erro');
  });
}

function ncRegistrada(d, pendente, avisoTxt) {
  travarLocal(d.serial);
  if (d.idLeitura) tirarDoHistorico(d.serial);
  LEIT.ignorar[d.serial] = Date.now();
  NCF = null;
  sinalErro();
  $('lrCorpo').innerHTML = '<div class="grande">NC REGISTRADA</div><div class="motivo">' + esc(d.serial) + '<br><b>SEPARE A PEÇA</b>' +
    (d.idLeitura ? '<br>O registro desta operação foi desfeito.' : '') + '</div>' +
    (pendente ? '<div class="msg alerta">⏳ Sem rede: a NC está guardada no tablet e vai sozinha quando a rede voltar.</div>' : '') +
    (avisoTxt ? '<div class="msg alerta">' + esc(avisoTxt) + '</div>' : '') +
    '<button class="ciente" id="ncCiente">OK</button>';
  $('ncCiente').onclick = function () { mostrar('laranja', false); pedirSerial(); atualizarSino(); };
  atualizarRede();
}

/* ================= Sino e aba NCs ================= */
var SINO = { ultimo: null };
function ajustarSino() {
  var s = sincLocal();
  var tem = !!(APP.usuario && s && s.nc && s.nc.sino && s.estacao === APP.usuario.estacao);
  mostrar('btSino', tem);
  return tem;
}
function atualizarSino() {
  if (!APP.usuario || !ajustarSino() || document.hidden) return Promise.resolve();
  return chamar('sinoNC', APP.token).then(function (r) {
    SINO.ultimo = r;
    var vista = Number(lsGet('sinoVisto') || 0), nova = r.ultima > vista;
    $('sinoNum').textContent = r.n;
    $('btSino').classList.toggle('tem', r.n > 0);
    $('btSino').classList.toggle('alerta', r.alertas.length > 0 || nova);
    if (nova && !visivel('ncPainel')) bip(700, 0.15, 2);
    if (visivel('ncPainel')) desenharAlertas();
  }).catch(function (e) { if (e.sessao) sessaoCaiu(e); });
}
$('btSino').onclick = function () { abrirPainelNC(); };
$('ncVoltar').onclick = function () { mostrar('ncPainel', false); pedirSerial(); };
$('ncAtualizar').onclick = function () { abrirPainelNC(); };

var NCL = { lista: [], avaliar: false };
function abrirPainelNC(msgOk) {
  mostrar('ncPainel', true);
  aviso('ncMsg', 'Carregando…', 'info');
  if (SINO.ultimo) lsSet('sinoVisto', String(SINO.ultimo.ultima || 0));
  $('btSino').classList.remove('alerta');
  atualizarSino();
  chamar('listarNCs', APP.token, {}).then(function (r) {
    NCL.lista = r.abertas; NCL.avaliar = r.avaliar;
    aviso('ncMsg', msgOk || (r.abertas.length ? '' : 'Nenhuma NC aberta.'), 'ok');
    desenharAlertas(); desenharNCs();
  }).catch(function (e) {
    if (e.sessao) { mostrar('ncPainel', false); return sessaoCaiu(e); }
    aviso('ncMsg', e.rede ? 'Sem rede: a lista de NCs precisa do servidor.' : e.message, 'erro');
  });
}
function desenharAlertas() {
  var a = SINO.ultimo ? SINO.ultimo.alertas : [];
  $('ncAlertas').innerHTML = a.length ? '<div class="alertas">🔔 Alertas<br>' + a.map(function (x) { return '<div>• ' + esc(x.texto) + '</div>'; }).join('') + '</div>' : '';
}
function desenharNCs() {
  $('ncLista').innerHTML = NCL.lista.map(function (n, i) {
    var est = n.estado === 'MANTIDA' ? '<span class="tag lar">MANTIDA</span>' : '<span class="tag">ABERTA</span>';
    return '<div class="cnc' + (n.vencida ? ' venc' : '') + '"><div class="t"><span>' + esc(n.serial) + ' · ' + esc(n.sku || '') + '</span><span>' + est +
      (n.vencida ? ' <span class="tag verm">PRAZO VENCIDO</span>' : '') + '</span></div>' +
      '<div class="d"><b>' + esc(n.tipoNome) + '</b> — ' + esc(n.descricao) + '</div>' +
      '<div class="d">Estação: <b>' + esc(n.opNome) + '</b> · aberta ' + esc(n.aberturaTxt) + ' por ' + esc(n.abertoPor) + ' · prazo ' + esc(n.prazoTxt) +
      (n.desfez ? ' · <i>registro da estação desfeito</i>' : '') + (n.offline ? ' · <i>sem rede</i>' : '') + '</div>' +
      (n.aviso ? '<div class="msg alerta">' + esc(n.aviso) + '</div>' : '') +
      (n.eventos.length > 1 ? '<div class="hist">' + n.eventos.slice(1).map(function (e) { return esc(e.quando) + ' ' + esc(e.evento) + ' (' + esc(e.usuario) + '): ' + esc(e.justificativa); }).join('<br>') + '</div>' : '') +
      '<div class="bts">' + (n.temFoto ? '<button class="claro" data-foto="' + i + '">Ver foto</button>' : '') +
      (NCL.avaliar ? '<button class="ok" data-av="LIBERAR" data-i="' + i + '">Liberar</button><button class="lar" data-av="MANTER" data-i="' + i + '">Manter</button><button class="perigo" data-av="REPROVAR" data-i="' + i + '">Reprovar</button>' : '') +
      '</div></div>';
  }).join('');
  $('ncLista').querySelectorAll('[data-foto]').forEach(function (b) { b.onclick = function () { verFoto(NCL.lista[Number(b.getAttribute('data-foto'))]); }; });
  $('ncLista').querySelectorAll('[data-av]').forEach(function (b) { b.onclick = function () { avaliar(NCL.lista[Number(b.getAttribute('data-i'))], b.getAttribute('data-av')); }; });
}
function verFoto(n) {
  abrirModal('<h3>Foto — ' + esc(n.serial) + '</h3><div id="fMsg"><div class="msg info">Carregando…</div></div><button class="sec bloco" id="fFechar">Fechar</button>');
  $('fFechar').onclick = fecharModal;
  chamarCom(TIMEOUT_NC_MS, 'fotoNC', [APP.token, n.id]).then(function (url) { if ($('fMsg')) $('fMsg').innerHTML = '<img class="foto" src="' + url + '" alt="foto da NC">'; })
    .catch(function (e) { aviso('fMsg', e.message, 'erro'); });
}
var ROT = { LIBERAR: 'Liberar', MANTER: 'Manter', REPROVAR: 'Reprovar' };
var EXPL = { LIBERAR: 'O problema foi resolvido. A peça destrava e precisa ser lida de novo na estação da NC (' , MANTER: 'Vai tentar corrigir de novo. A peça continua travada; nova avaliação em até 10 horas úteis.', REPROVAR: 'A peça não tem conserto: serial, etiqueta e SKU são cancelados (REPROVADA). Não tem volta.' };
function avaliar(n, dec) {
  var idc = 'A' + uuid().slice(1);
  abrirModal('<h3>' + ROT[dec] + ' — ' + esc(n.serial) + '</h3><p>' + esc(dec === 'LIBERAR' ? EXPL.LIBERAR + n.opNome + ').' : EXPL[dec]) + '</p>' +
    '<label>Justificativa (obrigatória, mínimo 15 caracteres)</label><textarea id="avJust" maxlength="500" style="min-height:90px;font-size:18px"></textarea><div id="avMsg"></div>' +
    '<div class="linha" style="margin-top:10px"><button class="' + (dec === 'LIBERAR' ? 'ok' : (dec === 'MANTER' ? 'lar' : 'perigo')) + '" id="avOk">' + ROT[dec] + '</button><button class="sec" id="avCanc">Voltar</button></div>');
  $('avCanc').onclick = fecharModal;
  $('avOk').onclick = function () {
    var j = $('avJust').value.trim();
    if (j.length < 15) return aviso('avMsg', 'Justificativa com pelo menos 15 caracteres (agora: ' + j.length + ').', 'erro');
    $('avOk').disabled = true;
    chamarCom(20000, 'avaliarNC', [APP.token, n.id, dec, j, idc]).then(function (r) {
      fecharModal();
      abrirPainelNC(n.serial + ': ' + (dec === 'LIBERAR' ? 'liberada' + (r.travada ? ' (ainda tem outra NC aberta)' : ' — ler de novo em ' + r.releer) : (dec === 'MANTER' ? 'mantida até ' + r.prazo : 'REPROVADA')) + '.');
    }).catch(function (e) {
      if ($('avOk')) $('avOk').disabled = false;
      if (e.sessao) { fecharModal(); mostrar('ncPainel', false); return sessaoCaiu(e); }
      aviso('avMsg', e.rede ? 'Sem rede: tente de novo (não grava em dobro).' : e.message, 'erro');
    });
  };
}

/* ---- trava e destrave ---- */
function telaTravada() {
  sinalErro();
  var s = sincLocal() || {};
  $('trMotivo').textContent = 'Mais de ' + (s.travaH || 2) + ' h sem falar com o servidor (último contato: ' + (ultimoContato() ? horaTxt(ultimoContato()) : 'nunca') + '). ' + lerFila().length + ' registro(s) aguardando envio.';
  aviso('trMsg', '');
  mostrar('travada', true);
  pedirSerial();
}
$('btTentar').onclick = function () {
  aviso('trMsg', 'Tentando…', 'info');
  chamar('ping').then(function () {
    mostrar('travada', false); enviarFila().then(sincronizar);
    dica('Sincronizado. Leia a peça de novo.');
  }).catch(function (e) {
    if (e.rede) aviso('trMsg', 'Ainda sem rede.', 'erro');
    else { mostrar('travada', false); enviarFila().then(sincronizar); } // servidor respondeu: rede ok
  });
};
$('btDestravar').onclick = function () {
  var s = sincLocal() || {};
  if (!s.destrave) { aviso('trMsg', 'Senha de destrave não cadastrada (Parâmetros → SENHA_DESTRAVE). Aguarde a rede voltar.', 'erro'); return; }
  abrirModal('<h3>Destravar tablet</h3><p>Senha de destrave do supervisor:</p><input id="dSenha" type="password" autocomplete="off">' +
    '<div class="linha" style="margin-top:10px"><button class="ok" id="dOk">Destravar</button><button class="sec" id="dCanc">Cancelar</button></div><div id="dMsg"></div>');
  $('dSenha').focus();
  $('dCanc').onclick = fecharModal;
  $('dSenha').onkeydown = function (ev) { if (ev.key === 'Enter') $('dOk').onclick(); };
  $('dOk').onclick = function () {
    var senha = $('dSenha').value;
    hashDestrave(senha, s.destrave.sal, s.destrave.iter).then(function (h) {
      if (h !== s.destrave.hash) { aviso('dMsg', 'Senha incorreta.', 'erro'); $('dSenha').value = ''; return; }
      var ate = Date.now() + (s.destraveMin || 30) * 60000;
      lsSet('destraveAte', String(ate));
      var d = lsJson('destraves', []); d.push({ quando: Date.now(), fila: lerFila().length, dispositivo: APP.dispositivo }); lsPut('destraves', d);
      fecharModal(); mostrar('travada', false); atualizarRede();
      dica('Destravado até ' + horaTxt(ate).slice(6) + '. Leia a peça de novo.');
    }).catch(function () { aviso('dMsg', 'Este aparelho não consegue conferir a senha (navegador sem criptografia).', 'erro'); });
  };
};
function hashDestrave(senha, sal, iter) {
  var enc = new TextEncoder();
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  var h = sal + '|' + senha, i = 0;
  return new Promise(function (ok, falha) {
    (function passo() {
      if (i >= iter) return ok(h);
      i++;
      crypto.subtle.digest('SHA-256', enc.encode(h + '|' + sal)).then(function (b) { h = hex(b); passo(); }, falha);
    })();
  });
}

/* ---- modal genérico, consulta, ajuda ---- */
function abrirModal(html) { $('modal').innerHTML = '<div class="modal-fundo"><div class="modal">' + html + '</div></div>'; }
function fecharModal() { $('modal').innerHTML = ''; }

$('btConsulta').onclick = function () {
  abrirModal('<h3>Consultar serial</h3><div class="linha"><input id="qSerial" placeholder="Serial" autocomplete="off" style="flex:3"><button id="qOk">Consultar</button></div>' +
    '<button class="claro bloco" id="qCam">Ler pela câmera</button><div id="qRes"></div><button class="sec bloco" id="qFechar">Fechar</button>');
  $('qOk').onclick = function () { consultar($('qSerial').value); };
  $('qSerial').onkeydown = function (ev) { if (ev.key === 'Enter') $('qOk').onclick(); };
  $('qCam').onclick = function () { LEIT.modoConsulta = true; fecharModal(); dica('Aponte para o serial a consultar.'); };
  $('qFechar').onclick = fecharModal;
};
function consultar(serial) {
  serial = normal(serial);
  if (!$('qRes')) $('btConsulta').onclick();
  $('qSerial').value = serial;
  aviso('qRes', 'Consultando…', 'info');
  chamar('consultarSerial', APP.token, serial).then(function (r) {
    $('qRes').innerHTML = '<table>' +
      '<tr><td>Serial</td><td><b>' + esc(r.serial) + '</b>' + (r.posicao ? ' (' + esc(r.posicao) + ')' : '') + '</td></tr>' +
      '<tr><td>SKU</td><td>' + esc(r.sku) + '</td></tr>' +
      '<tr><td>Situação</td><td><b>' + esc(r.situacao) + '</b>' + (r.ncs ? ' · <span style="color:#c92a2a">' + r.ncs + ' NC aberta: ' +
        (r.ncsAbertas || []).map(function (x) { return esc(x.operacaoNome) + ' ' + esc(x.aberturaTxt); }).join('; ') + '</span>' : '') + '</td></tr>' +
      (r.etiquetaPendente ? '<tr><td>Etiqueta</td><td><b style="color:#c92a2a">Etiqueta nova pendente</b> (transformada' + (r.skuAnterior ? ' de ' + esc(r.skuAnterior) : '') + '): imprima e troque o par</td></tr>' : '') +
      '<tr><td>Próxima operação</td><td>' + esc(r.proxima || '—') + '</td></tr>' +
      '<tr><td>Registros</td><td>' + (r.feitas.length ? r.feitas.map(function (f) { return esc(f.op) + ' — ' + esc(f.quando); }).join('<br>') : 'nenhum') + '</td></tr>' +
      ((r.transf || []).length || r.situacao === 'EM TRANSFORMAÇÃO' ? '<tr><td>Transformação</td><td>' + (r.skuAnterior ? 'de ' + esc(r.skuAnterior) + '<br>' : '') + ((r.transf || []).length ? r.transf.map(function (f) { return esc(f.op) + ' — ' + esc(f.quando); }).join('<br>') : 'nenhum registro ainda') + '</td></tr>' : '') +
      '</table>';
  }).catch(function (e) {
    if (e.sessao) { fecharModal(); return sessaoCaiu(e); }
    aviso('qRes', e.rede ? 'Sem rede: a consulta precisa do servidor.' : e.message, 'erro');
  });
}

function abrirAjuda() {
  abrirModal('<h3>Ajuda — instalar e fixar a tela</h3>' +
    '<p><b>Android (Chrome)</b></p><ol class="ajuda">' +
    '<li>No Chrome, abra este endereço, toque em ⋮ → <b>Adicionar à tela inicial</b> (ou Instalar app).</li>' +

    '<p><b>ASTP (Embalagem)</b>: leia só o EAN da etiqueta de SKU no lugar do serial. Cada leitura é 1 unidade: toque OK antes da próxima. Leu duas vezes? Toque <b>Anular</b> logo em seguida.</p>' +

$('btAjuda2').onclick = abrirAjuda;

/* ================= Câmera ================= */
var CAM = { stream: null, timer: null, zx: null };
function carregarZXing() {
  return new Promise(function (ok, falha) {
    if (window.ZXing) return ok();
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js';
    s.onload = ok; s.onerror = function () { falha(new Error('não carregou o leitor (sem rede?)')); };
    document.head.appendChild(s);
  });
}
function camMsg(t) { $('camMsg').textContent = t || ''; mostrar('camMsg', !!t); mostrar('video', !t); document.querySelector('.mira').classList.toggle('oculto', !!t); }
function abrirCamera() {
  pararCamera(); camMsg('');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camMsg('Câmera indisponível neste navegador. Use o campo de digitar.'); return; }
  var temBD = 'BarcodeDetector' in window;
  var p = temBD ? BarcodeDetector.getSupportedFormats().then(function (f) { return f.indexOf('code_128') >= 0 && f.indexOf('ean_13') >= 0; }).catch(function () { return false; }) : Promise.resolve(false);
  p.then(function (nativo) { return nativo ? abrirNativo() : carregarZXing().then(abrirZXing); })
    .catch(function (e) { camMsg('Câmera não abriu (' + (e.name === 'NotAllowedError' ? 'permissão negada' : (e.message || e.name || 'erro')) + '). Toque em "Reabrir câmera" ou digite o código.'); });
}
var RESTR = { video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
function abrirNativo() {
  return navigator.mediaDevices.getUserMedia(RESTR).then(function (st) {
    CAM.stream = st; var v = $('video'); v.srcObject = st;
    return v.play().then(function () {
      var det = new BarcodeDetector({ formats: ['code_128', 'ean_13'] }), ocupado = false;
      CAM.timer = setInterval(function () {
        if (ocupado || v.readyState < 2 || LEIT.ocupado) return; ocupado = true;
        det.detect(v).then(function (cods) { if (cods.length) aoLer(cods[0].rawValue, 'CAMERA'); }).catch(function () {}).then(function () { ocupado = false; });
      }, 120);
    });
  });
}
function abrirZXing() {
  var hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.EAN_13]);
  CAM.zx = new ZXing.BrowserMultiFormatReader(hints, 150);
  return CAM.zx.decodeFromConstraints(RESTR, 'video', function (res) { if (res && !LEIT.ocupado) aoLer(res.getText(), 'CAMERA'); });
}
function pararCamera() {
  if (CAM.timer) clearInterval(CAM.timer); CAM.timer = null;
  if (CAM.stream) CAM.stream.getTracks().forEach(function (t) { t.stop(); }); CAM.stream = null;
  if (CAM.zx) { try { CAM.zx.reset(); } catch (e) {} CAM.zx = null; }
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) pararCamera();
  else if (APP.usuario && visivel('telaLeitura')) { abrirCamera(); manterTelaLigada(); enviarFila(); atualizarSino(); }
});

var WL = null;
function manterTelaLigada() { try { if (navigator.wakeLock && !WL) navigator.wakeLock.request('screen').then(function (w) { WL = w; w.addEventListener('release', function () { WL = null; }); }).catch(function () {}); } catch (e) {} }

iniciar();
</script>
